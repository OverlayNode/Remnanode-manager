<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" rx="22" fill="#07111f"/>
  <rect x="1" y="1" width="1198" height="718" rx="21" fill="none" stroke="#17304b" stroke-width="2"/>
  <circle cx="32" cy="30" r="7" fill="#ff5f57"/><circle cx="56" cy="30" r="7" fill="#febc2e"/><circle cx="80" cy="30" r="7" fill="#28c840"/>
  <text x="600" y="37" fill="#7991aa" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="16">remnanode — snippets &amp; WARP</text>
  <g font-family="ui-monospace,Consolas,monospace" font-size="20" fill="#dce9f7">
    <text x="42" y="92" fill="#7991aa">$ remnanode snippet list</text>
    <text x="42" y="136" fill="#30e67a">[on]</text><text x="108" y="136">outbound   freedom-direct          DIRECT outbound</text>
    <text x="42" y="172" fill="#30e67a">[on]</text><text x="108" y="172">outbound   blackhole               BLOCK outbound</text>
    <text x="42" y="208" fill="#30e67a">[on]</text><text x="108" y="208">routing    private-networks-block  Block private networks</text>
    <text x="42" y="244" fill="#30e67a">[on]</text><text x="108" y="244">routing    torrent-block           Block BitTorrent</text>
    <text x="42" y="280" fill="#febc2e">[off]</text><text x="108" y="280">routing    ru-direct               RU direct</text>
    <text x="42" y="330" fill="#7991aa">$ remnanode warp status</text>
    <text x="42" y="374">WARP account      <tspan fill="#30e67a">OK</tspan></text>
    <text x="42" y="410">WireGuard config  <tspan fill="#30e67a">OK</tspan></text>
    <text x="42" y="446">Xray outbound     <tspan fill="#30e67a">CONFIGURED</tspan></text>
    <text x="42" y="482">Mode              <tspan fill="#19d3ff">XRAY_OUTBOUND</tspan></text>
    <text x="42" y="518">Default route     <tspan fill="#30e67a">unchanged</tspan></text>
    <text x="42" y="574" fill="#7991aa">$ remnanode warp test warp-main</text>
    <text x="42" y="618">ip=104.28.•••.•••   loc=DE   warp=<tspan fill="#30e67a">on</tspan></text>
    <text x="42" y="666" fill="#30e67a">RESULT: SUCCESS</text>
  </g>
</svg>
